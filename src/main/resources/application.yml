spring:
  profiles:
    active: local
  main:
    banner-mode: "off"

logging:
  level:
    org:
      springframework.jdbc: WARN
      hibernate: WARN

---

spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:db;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
